name: Bug report
description: Report a problem with Polyglot i+1
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step, including target/native language and CEFR level if relevant.
      placeholder: |
        1. Set target language to ...
        2. Generate a lesson
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      description: Found in package.json, or the commit hash if running from source.
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors / logs
      description: Open your browser's developer console and paste any relevant errors.
      render: shell
    validations:
      required: false
